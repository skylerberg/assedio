[workspace]
members = ["assedio-core", "assedio-wasm", "assedio-runner"]
resolver = "2"

[workspace.dependencies]
# Pinned to a commit rather than a branch: an unpinned engine would let a
# change over there move the AI here with no commit in this repository to
# explain it. Bump deliberately, alongside whatever needs the newer engine.
mcts = { git = "https://github.com/skylerberg/monte_carlo", rev = "5a5d274575c4f83e9b309eaf32c90aeb8d7ebdc5", default-features = false }
mcts-tune = { git = "https://github.com/skylerberg/monte_carlo", rev = "5a5d274575c4f83e9b309eaf32c90aeb8d7ebdc5" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wyrand = "0.4"

[profile.release]
lto = true
codegen-units = 1
