name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      BUCKET: assedio-web
    steps:
      - uses: actions/checkout@v7

      # Installs pnpm and Node in one step, reading the pnpm version from
      # package.json's `packageManager`. pnpm/action-setup is deprecated for
      # pnpm 11; pnpm/setup is its replacement.
      - uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true
          install: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Install wasm-pack
        run: curl -sSf https://rustwasm.github.io/wasm-pack/installer/init.sh | sh

      - run: pnpm install --frozen-lockfile

      - run: pnpm run build

      # After the build, so no install or build script runs holding AWS
      # credentials. The role is in infra/terraform and trusts only main.
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-west-2

      # Assets first, and never deleted: their names are content hashes, so they
      # are immutable, and a tab opened before this deploy still finds its own.
      # Everything else is revalidated on each load, which is what lets a deploy
      # go live without a CloudFront invalidation.
      - name: Upload
        run: |
          aws s3 cp dist/assets "s3://$BUCKET/assets" --recursive \
            --cache-control 'public, max-age=31536000, immutable'
          aws s3 cp dist "s3://$BUCKET" --recursive --exclude 'assets/*' \
            --cache-control 'no-cache'
